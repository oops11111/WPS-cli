<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新员工培训</title>
<style>
  body { margin: 0; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  section { width: 1280px; height: 720px; position: relative; box-sizing: border-box; padding: 60px 80px; }
  .cover { background: #1f4e79; color: #ffffff; }
  .cover h1 { font-size: 54px; margin-top: 200px; }
  h2 { font-size: 40px; color: #1f4e79; }
  li { font-size: 28px; margin: 12px 0; }
  .box { background: #deebf7; border: 2px solid #2e75b6; padding: 20px; font-size: 26px; width: 900px; }
  @keyframes enter { from { opacity: 0; transform: translateX(-100%); } to { opacity: 1; } }
  @keyframes leave { from { opacity: 1; } to { opacity: 0; } }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .in { animation: enter 0.6s ease 0s both; }
  .out { animation: leave 0.5s ease 0.5s both; }
  .pulse { animation: pulse 1s ease 0s both; }
</style>
</head>
<body>
<section class="cover" data-transition="fade">
  <h1 class="in">新员工培训</h1>
  <p style="font-size:28px">人力资源部 · 2026 年 11 月</p>
</section>
<section data-transition="push">
  <h2>培训安排</h2>
  <ul>
    <li class="in">第一天：公司文化与制度</li>
    <li class="in" data-trigger="click">第二天：产品与业务</li>
    <li class="in" data-trigger="after">第三天：岗位实操</li>
  </ul>
</section>
<section data-transition="wipe">
  <h2>考核方式</h2>
  <div class="box pulse">笔试 40% + 实操 60%，总分 80 分合格</div>
  <p class="out" style="font-size:24px">（本页提示将在 0.5 秒后淡出）</p>
  <aside class="notes">提醒学员带好工牌。</aside>
</section>
</body>
</html>
