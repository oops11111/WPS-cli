<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>季度经营回顾</title>
<style>
  body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  section { width: 1280px; height: 720px; padding: 50px 70px; box-sizing: border-box; }
  h1 { font-size: 48px; }
  h2 { font-size: 36px; color: #c55a11; }
  table { border-collapse: collapse; font-size: 24px; }
  th, td { border: 1px solid #7f7f7f; padding: 8px 16px; }
  th { background: #fbe5d6; }
  @keyframes zoom { from { transform: scale(0); } to { transform: scale(1); } }
  .zoom { animation: zoom 0.8s ease 0.2s both; }
</style>
</head>
<body>
<section data-transition="fade"><h1>2026 Q3 经营回顾</h1><p style="font-size:26px">财务部</p></section>
<section data-transition="cover">
  <h2>核心指标</h2>
  <table class="zoom">
    <tr><th>指标</th><th>Q2</th><th>Q3</th><th>环比</th></tr>
    <tr><td>收入（万元）</td><td>4,010</td><td>4,820</td><td>+20.2%</td></tr>
    <tr><td>毛利率</td><td>39.3%</td><td>38.2%</td><td>-1.1pt</td></tr>
    <tr><td>新客户</td><td>126</td><td>158</td><td>+25.4%</td></tr>
  </table>
  <aside class="notes">重点解释毛利率下降原因。</aside>
</section>
<section data-transition="split"><h2>下季度重点</h2><ul><li>海外市场试点</li><li>成本优化专项</li><li>渠道数字化</li></ul></section>
</body>
</html>
