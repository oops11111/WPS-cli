<h1>研发月刊 第 10 期</h1>
<p class="lead">本期聚焦<span class="tag">性能优化</span>与<span class="tag">新人培养</span>两大主题。</p>
<h2>头条：查询延迟下降 63%</h2>
<p>经过两个迭代的优化，核心查询的 P99 延迟从 <strong>820 ms</strong> 降至 <strong>300 ms</strong>，主要手段包括：</p>
<ul>
  <li>引入列式缓存，命中率达到 <em>92%</em>；</li>
  <li>重写热点 SQL，减少 N+1 查询；</li>
  <li>连接池参数按负载自动调整。</li>
</ul>

<h2>新人园地</h2>
