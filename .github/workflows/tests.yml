name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff from the lint extra
        run: python -m pip install -e ".[lint]"
      - name: Run ruff (rules in pyproject.toml)
        run: ruff check .
      - name: Check formatting (ruff format, settings in pyproject.toml)
        run: ruff format --check .

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with the test extra
        run: python -m pip install -e ".[test]"
      - name: Run unit tests (COM-dependent cases are skipped without WPS)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

  powershell-fake-com:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with the test extra
        run: python -m pip install -e ".[test]"
      - name: Run the PowerShell fake-COM and script-syntax tests
        env:
          PYTHONPATH: src
          WPS_TEST_PWSH: pwsh
        run: |
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          python -m unittest discover -s tests

  # P14-003: the installer, end to end, as a Windows user runs it (Windows PowerShell 5.1): wheel with [all],
  # Playwright on the runner's Node.js driving its Edge, PATH shim, Claude Desktop config, uninstall.
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Seed the user environment the installer must keep
        shell: powershell
        run: |
          # An unexpanded %VARIABLE% entry in the user PATH, and a NODE_PATH of the user's own.
          $key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $path = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $key.SetValue('Path', (($path.TrimEnd(';') + ';%USERPROFILE%\wps-agent-ci-marker').TrimStart(';')), 'ExpandString')
          $key.SetValue('NODE_PATH', 'C:\ci\own_node_modules', 'String')
          $key.Close()
      - name: Install with scripts/install/install.ps1, twice (the second run is an upgrade)
        shell: powershell
        run: |
          $home_ = Join-Path $env:RUNNER_TEMP ((-join [char[]](0x5B89, 0x88C5)) + ' wps-agent')  # a Chinese name with a space
          $wheel = (Get-ChildItem dist\*.whl)[0].FullName
          foreach ($run in 1, 2) {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install\install.ps1 -WheelPath $wheel -InstallDir $home_ -McpClient claude-desktop
            if ($LASTEXITCODE -ne 0) { throw "installer run $run failed: $LASTEXITCODE" }
          }
      - name: Use the installed wps-agent outside the repository
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $home_ = Join-Path $env:RUNNER_TEMP ((-join [char[]](0x5B89, 0x88C5)) + ' wps-agent')  # a Chinese name with a space
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $userPath = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $pathKind = $key.GetValueKind('Path')
          $nodePath = [string]$key.GetValue('NODE_PATH')
          $key.Close()
          if (@($userPath -split ';' | Where-Object { $_ -ieq "$home_\bin" }).Count -ne 1) { throw "bin is not on the user PATH once: $userPath" }
          if ($userPath -notlike '*%USERPROFILE%\wps-agent-ci-marker*' -or $pathKind -ne 'ExpandString') { throw "the user PATH lost its %USERPROFILE% entry or type: $pathKind $userPath" }
          if ($nodePath -ne "$home_\node\node_modules;C:\ci\own_node_modules") { throw "NODE_PATH is not ours first, then the user's: $nodePath" }
          $env:NODE_PATH = $nodePath
          $agent = "$home_\bin\wps-agent.cmd"
          $work = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\use"
          Copy-Item fixtures\fidelity\contract.html $work
          Push-Location $work
          $inspect = (& $agent inspect-env) | Out-String | ConvertFrom-Json
          if (-not $inspect.ok) { throw 'inspect-env through the shim failed' }
          $render = (& $agent html-render --input contract.html --output contract.pdf --format pdf) | Out-String | ConvertFrom-Json
          if (-not $render.ok) { throw ("html-render failed: " + ($render.errors | ConvertTo-Json -Compress)) }
          if ((Get-Item contract.pdf).Length -lt 1000) { throw 'contract.pdf is empty' }
          Pop-Location
          $config = [IO.File]::ReadAllText("$env:APPDATA\Claude\claude_desktop_config.json", [Text.Encoding]::UTF8) | ConvertFrom-Json
          $server = $config.mcpServers.'wps-agent'
          if ($server.args[0] -ne 'mcp-server') { throw 'Claude Desktop config not written' }
          if ($server.command -ne "$home_\venv\Scripts\wps-agent.exe") { throw "the server command lost its path: $($server.command)" }
          if (-not $server.env.WPS_AGENT_WORKSPACE) { throw 'no WPS_AGENT_WORKSPACE in the server entry' }
          Write-Host "installed wps-agent $($inspect.data.platform.python) renders HTML and is in Claude Desktop's config"
      - name: Uninstall
        shell: powershell
        run: |
          $home_ = Join-Path $env:RUNNER_TEMP ((-join [char[]](0x5B89, 0x88C5)) + ' wps-agent')  # a Chinese name with a space
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install\install.ps1 -Uninstall -InstallDir $home_
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed: $LASTEXITCODE" }
          if (Test-Path -LiteralPath $home_) { throw 'install folder left behind' }
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $userPath = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $pathKind = $key.GetValueKind('Path')
          $nodePath = [string]$key.GetValue('NODE_PATH')
          $key.Close()
          if ($userPath -like '*wps-agent\bin*') { throw 'PATH entry left behind' }
          if ($userPath -notlike '*%USERPROFILE%\wps-agent-ci-marker*' -or $pathKind -ne 'ExpandString') { throw "uninstall changed the rest of the user PATH: $pathKind $userPath" }
          if ($nodePath -ne 'C:\ci\own_node_modules') { throw "uninstall did not leave the user's NODE_PATH: $nodePath" }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and the source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean virtual environment and run it
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/wps-agent inspect-env > inspect-env.json
          /tmp/wheel-check/bin/wps-agent tasks --phase phase4 > tasks.json
          /tmp/wheel-check/bin/wps-agent mcp-server --once-json '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' > initialize.json
          /tmp/wheel-check/bin/python - <<'PY'
          import json
          import wps_ai_agent_cli
          for name in ("inspect-env.json", "tasks.json"):
              assert json.load(open(name))["ok"] is True, name
          server_info = json.load(open("initialize.json"))["result"]["serverInfo"]
          assert server_info["version"] == wps_ai_agent_cli.__version__, server_info
          print("wheel", wps_ai_agent_cli.__version__, "ok")
          PY
      - name: Run the safe regression profile from the installed wheel, outside the repository
        run: |
          mkdir -p /tmp/wheel-regression
          cd /tmp/wheel-regression
          /tmp/wheel-check/bin/wps-agent regression-run --profile safe --artifact-dir /tmp/wheel-regression/artifacts > result.json
          /tmp/wheel-check/bin/python - <<'PY'
          import json
          payload = json.load(open("result.json"))
          regression = payload["data"]["regression"]
          assert payload["ok"] is True, payload["errors"]
          assert regression["failed_count"] == 0 and regression["scenario_count"] >= 7, regression
          assert "site-packages" in regression["manifest_path"], regression["manifest_path"]
          print("safe profile from the wheel:", regression["passed_count"], "of", regression["scenario_count"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
