name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff from the lint extra
        run: python -m pip install -e ".[lint]"
      - name: Run ruff (rules in pyproject.toml)
        run: ruff check .

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with the test extra
        run: python -m pip install -e ".[test]"
      - name: Run unit tests (COM-dependent cases are skipped without WPS)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

  powershell-fake-com:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with the test extra
        run: python -m pip install -e ".[test]"
      - name: Run the PowerShell fake-COM and script-syntax tests
        env:
          PYTHONPATH: src
          WPS_TEST_PWSH: pwsh
        run: |
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          python -m unittest discover -s tests
