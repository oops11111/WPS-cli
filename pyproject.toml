[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wps-ai-agent-cli"
dynamic = ["version"]
description = "Agent-friendly CLI for controlling WPS Office on Windows with validation and recovery."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "WPS AI Agent CLI maintainers" }
]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
wps = ["pywin32>=306; platform_system == 'Windows'"]
html = ["python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]
fidelity = ["numpy>=1.24", "Pillow>=10", "pypdfium2>=4"]
markdown = ["markdown-it-py>=3"]
pdf = ["pdfplumber>=0.11", "pypdfium2>=4", "Pillow>=10"]
ocr = ["rapidocr_onnxruntime>=1.2", "pdfplumber>=0.11", "numpy>=1.24"]
test = [
    "python-docx>=1.1",
    "Pillow>=10",
    "pypdfium2>=5",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pdfplumber>=0.11",
    "numpy>=1.24",
]
lint = ["ruff==0.16.8"]

[project.scripts]
wps-agent = "wps_ai_agent_cli.cli:main"

[tool.setuptools.dynamic]
# The version lives only in src/wps_ai_agent_cli/__init__.py. See docs/RELEASING.md.
version = { attr = "wps_ai_agent_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wps_ai_agent_cli = ["*.cjs", "*.json", "resources/*.json"]

[tool.ruff]
target-version = "py310"
# Used by ruff format. Lint does not check line length (see below).
line-length = 120
extend-exclude = ["artifacts"]

[tool.ruff.lint]
# Ruff's default set (pyflakes and pycodestyle errors) plus warnings, bugbear, import sorting and
# pyupgrade. Line length is not checked: the PowerShell scripts embedded in f-strings would need
# hundreds of manual wraps.
select = ["E4", "E7", "E9", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# B023 (closure uses a loop variable) is checked everywhere else. In these files every flagged closure
# is defined and called within the same loop iteration, so it always sees that iteration's values.
"src/wps_ai_agent_cli/writer_structure.py" = ["B023"]
"tests/test_com_backend.py" = ["B023"]
"tests/test_mcp_config_audit.py" = ["B023"]
"tests/test_mcp_smoke.py" = ["B023"]
"tests/test_open_documents.py" = ["B023"]
"tests/test_presentation_text.py" = ["B023"]
"tests/test_regression.py" = ["B023"]
"tests/test_writer_replace_scope.py" = ["B023"]
