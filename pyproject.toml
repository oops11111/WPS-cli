[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wps-ai-agent-cli"
version = "0.1.0"
description = "Agent-friendly CLI for controlling WPS Office on Windows with validation and recovery."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "WPS AI Agent CLI maintainers" }
]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
wps = ["pywin32>=306; platform_system == 'Windows'"]
html = ["python-docx>=1.1", "python-pptx>=1.0"]
test = ["python-docx>=1.1", "Pillow>=10", "pypdfium2>=5", "openpyxl>=3.1", "python-pptx>=1.0"]
lint = ["ruff==0.16.8"]

[project.scripts]
wps-agent = "wps_ai_agent_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wps_ai_agent_cli = ["*.cjs", "*.json"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
# Start from ruff's default set (pyflakes and pycodestyle errors) plus warnings. Line length is not
# checked: the PowerShell scripts embedded in f-strings would need hundreds of manual wraps.
select = ["E4", "E7", "E9", "F", "W"]
