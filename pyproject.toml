[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wps-ai-agent-cli"
version = "0.1.0"
description = "Agent-friendly CLI for controlling WPS Office on Windows with validation and recovery."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "WPS AI Agent CLI maintainers" }
]
dependencies = []

[project.optional-dependencies]
wps = ["pywin32>=306; platform_system == 'Windows'"]
html = ["python-docx>=1.1"]
test = ["python-docx>=1.1", "Pillow>=10", "pypdfium2>=5"]

[project.scripts]
wps-agent = "wps_ai_agent_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wps_ai_agent_cli = ["*.cjs"]

[tool.unittest]
start-directory = "tests"
